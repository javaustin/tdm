# the gamePlayer formatter includes:
#     playerFormatter
#     player-team = player-team-prefix
#     player-team-color

indicators:
  # Indicators that display on a gamePlayer
  ready: "&aReady"
  not-ready: "&7Not ready"

lobby:
  # gamePlayer
  chat: "{player-team-prefix}{player-rank-prefix}{player-rank-color}{player}: {player-chat-color}{content}" # + content
  join: "{player-rank-prefix}{player-rank-color}{player} &ejoined the lobby."
  leave: "{player-rank-prefix}{player-rank-color}{player} &eleft the lobby."

  teams-reset-announcement: "&cTeams have been reset by an admin!"

  # teamFormatter, gamePlayer
  team:
    join: "&eYou joined {team-color}{team-name}"
    join-announcement: "{player-team-color}{player} joined the team"

    leave: "&eYou left {team-color}{team-name}"
    leave-announcement: "{player-team-color}{player} left the team"

    list:
      list: |
        {player-team-display}: {members}

      team-members-list:
        entry-format: "{player-rank-color}{player}"
        separator: ", "
        max-entries: 9999

  info:
    all-ready: "&aAll players have readied up! Skipping countdown."
    start-countdown: "&eGame starting in &6{count} &eseconds." # + {count}
    start-cancel: "&eStart cancelled! There are not enough players to start a game." # N/A

game:
  # gamePlayer
  chat: "{player-team-prefix}{player-rank-color}{player}: &f{content}" # + {content}
  join: "{player-rank-prefix}{player-rank-color}{player} &ejoined the game."
  leave: "{player-rank-prefix}{player-rank-color}{player} &eleft the game."

  timer-reset-announcement: "&a{timer} timer was reset by an admin!"

  info:
    blurb: |
        &f---------------------- &e&lTDM &f----------------------
        &eKill your enemies by using your the available items in your kit. The first team to reach {game-winning-kills} kills wins the game!
        &f-------------------------------------------------
    invul-countdown: "&cInvulnerability wears off in {count} seconds." # {count}
    invul-over: "&4Invulnerability has worn off!"
    refill-announcement: "&6Chests refilled!" # N/A

    mid-game-join:
      title:
        title: "&aYou are on {player-team-prefix-display}!"
        subtitle: "&eYou will spawn in {count} seconds."
        fade-in-ticks: 0
        stay-ticks: 40
        fade-out-ticks: 20

      message: "&aYou will be spawned into the game shortly."

    showdown:
      title:
        title: "&6&lSHOWDOWN"
        subtitle: "&eThe world border will start shrinking!"
        fade-in-ticks: 0
        stay-ticks: 40
        fade-out-ticks: 20

      message: "&6The world border will start shrinking!"


  # ALL (if applicable): playerFormatter ({player}, {attacker}), teamFormatter ({team})
  death:
    announcement:

      player:
        melee: "&e{player-team-color}{player} &ewas killed by {attacker-team-color}{attacker}!"
        projectile: "&e{player-team-color}{player} &ewas shot by {attacker-team-color}{attacker}!"
        explosive: "&e{player-team-color}{player} &ewas blown up by {attacker-team-color}{attacker}!"
        default: "&e{player-team-color}{player} &edied!"

    message:
      team:
        default: ""

      player:
        melee: ""
        projectile: ""
        explosive: ""
        default: ""

    title-with-respawn:
      title: "&c&lYOU DIED!"
      subtitle: "&aYou will respawn in &f{count} &aseconds." # {count}
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20


  # gamePlayerFormatter {player}, teamFormatter {team}
  kill:
    message:
      team:
        default: ""

      player:
        melee: ""
        projectile: ""
        explosive: ""
        default: ""

  gun:
    out-of-ammo: "&cOut of ammo!"
    ammo-indicator-action-bar: "&eAmmo: {ammo}/{mag-size}"

    reload-action-bar:
      fail: "&cReload cancelled!"
      success: "&eReloaded!"
      background-units: "&7█"
      progress-units: "&e█"

  power-up:
    pickup: "&eYou picked up a((n)) {display-name}!"


  # N/A
  respawn:
    title:
      title: "&a&lRespawned!"
      subtitle: ""
      fade-in-ticks: 0
      stay-ticks: 20
      fade-out-ticks: 20

    message: "&aYou have been respawned!"
    respawned-by-admin-announcement: "&e{player} was respawned by an admin!"


  # gamePlayerFormatter ({winner-player}, {player}), teamFormatter ({winner-team}, {team})
  win:
    victory-title:
      title: "&6&lVICTORY"
      subtitle: "&eYou've won the match!"
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20

    lose-title:
      title: "&6&lGame over!"
      subtitle: "&eBetter luck next time!"
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20


  recaps:
    # This defines the {top-killers} placeholder in the recaps. {i} represents the position number in the leaderboard.
    top-killers-numbered-list:
      entry-format: "{player-team-color}{player}: &7{player-temp-stat-kills} kills"
      separator: "\n&f{i}.)) "
      max-entries: 3

    # This defines the {team-members} placeholder in the recaps
    team-list:
      entry-format: "{player-rank-color}{player}"
      separator: ", "
      max-entries: 9999

    winner: |
      &f---------- {winner-team-color}{winner-team-display} won the game! &f----------
      &eScore: {winner-team-color}&l{winner-team-score} &f- {loser-team-color}&l{loser-team-score} 
      
      &fMembers: {winner-team-members}
      
      &fTop killers:{top-killers}
      &f-----------------------------------------------



command:
  # gameFormatter
  create: "[&aCreated new game ((id: {game-id}))!](HOVER:&eClick to join)(RUN_COMMAND:/tdm join {game-id})"
  delete: "&aDeleted game {game-id}"
  delete-announcement-title:
    title: "&eGame deleted"
    subtitle: "&eAn admin has deleted the game!"
    fade-in-ticks: 0
    stay-ticks: 40
    fade-out-ticks: 20

  join: "&aYou joined game {game-id}!"
  leave: "&aYou left game {game-id}!"

  kit: "&aYou selected the kit: &e{player-kit}"
  kit-fail: "&cYou may not use this command mid-game."

  list:
    message: |
      &f---------- &e&lTDM Available Games &r&f----------
      {games}
      [&f< Previous](RUN_COMMAND:/tdm list {previous-page})   &7Page {page}/{max-pages}   [&fNext >](RUN_COMMAND:/tdm list {next-page})
    blank: "&cThere are no tdm games running!"
    entry-format: "&f* [&a{game-id} on {game-map} (({game-size} players))](HOVER:&eClick to join {game-id})(RUN_COMMAND:/tdm join {game-id})"
    separator: "\n"
    max-entries-per-page: 5

  setting:
    get: "{key} for game &f{game} &ais &f{value}."
    set: "&aSet {key} for &f{game} &ato &f{value}."
    fail: "&eThis setting cannot be updated during this time."

  freeze: "&7[[&4!&7]] {player-rank-prefix}{player-rank-color}{player-display-name} &efroze the game!"
  unfreeze: "&7[[&4!&7]] {player-rank-prefix}{player-rank-color}{player-display-name} &eunfroze the game!"

  toggle-ready: ""
  toggle-not-ready: ""
  toggle-ready-fail: "&eThis command is only available in the lobby."

  set-player-lives: "&aSet {player}'s lives to {player-lives}."
  get-player-lives: "&a{player} has {player-lives} lives."

  info:
    message: |
      &f------------ &6&lGame Info &r&f------------
      &aGame ID: &f{game-id} &7(({game-size} players))
      &aMap: &f{game-map}
      &aTime Elapsed: &f{game-time-elapsed}
      &aNext Event: &f{game-next-event} &7(({game-next-event-time}))
      &aPlayers [[{game-players-size}/{game-capacity}]]: &f{players}
      &f-----------------------------------

    blank: "&cYou are not in a tdm game."
    entry-format: "&f{player-rank-color}{player-display-name}"
    separator: ", "
    max-entries: 16

errors:

  game:
    no-games: "&cThere are no TDM games running!"
    duplicate-game: "&cThis game already exists!"
    duplicate-game-join: "&cYou are already in this game!"
    already-in-game: "&cYou are already in a game!"
    not-in-game: "&cYou are not in a game."

  team:
    full: "&eThis team is full!"
    no-switching: "&cYou may not switch teams at this time."
    not-in-team: "&eYou are not in a team!"
    already-in-team: "&eYou are already in this team!"

  command:
    no-access: "[&cYou do not have access to this command!](HOVER:&cYou do not have the required permission: {permission})"
    player-only: "&cThis command must be used by a player!"

  player:
    is-offline: "&cThis player is offline!" # Format MF.playerFormatter(target);
    is-self: "&cYou cannot use this command on yourself!" # no format
    not-found: "[&cPlayer not found!](HOVER:&7Could not find player with the username of &f{username}&7!)" # Format: username

  args:
    missing:
      general: "&cThis command is missing the required argument((s)): &f{missing-args}" # format w/ {missing-args}, {syntax}

    invalid:
      game: "[&cGame not found!](HOVER:Could not find a game with the id '{input}'.)"
      map: "&cMap not found!"
      lobby-map: "&cSorry! The lobby map cannot be used for TDM games."
      team: "&cTeam not found!"
      integer: "&cPlease provide a valid integer > 0."
      page: "[&cPlease provide a valid page between {min}-{max}!](HOVER:Your input: {page})"
      kit: "&cKit not found!"
      range: "&c{input} is an invalid range!"